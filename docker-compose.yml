# Запускается ТОЛЬКО бот. Postgres и Redis уже работают в Docker на сервере.
#
# network_mode: host — контейнер использует сеть хоста, поэтому достучаться до
# существующих Postgres/Redis можно по localhost (если их порты 5432/6379
# опубликованы на хост). DATABASE_URL и REDIS_URL берутся из .env.
#
# Если Postgres/Redis НЕ публикуют порты на хост, а доступны только во внутренней
# docker-сети — уберите network_mode и подключите бота к той сети (см. README).

services:
  bot:
    build: .
    container_name: sub_bot
    restart: unless-stopped
    env_file: .env
    network_mode: host
    # Если используете внутреннюю docker-сеть вместо host — закомментируйте
    # network_mode выше и раскомментируйте блок ниже, указав имя сети:
    # networks:
    #   - infra
    # И пропишите в .env DATABASE_URL/REDIS_URL с именами контейнеров pg/redis.

# networks:
#   infra:
#     external: true
